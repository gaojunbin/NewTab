# NewTab 导航页 - 一键启动
# 使用: docker compose up -d
services:
  newtab:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: newtab
    restart: unless-stopped
    ports:
      - "8015:80"
    volumes:
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=production
      - EDIT_PASSWORD=${EDIT_PASSWORD:-}
